apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mock-app-prod
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: 'https://github.com/akshdubey/argocd-helm-environments.git'
    targetRevision: HEAD
    path: charts/mock-app
    helm:
      valueFiles:
        - ../../environments/prod-values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: mock-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

