apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-app
  labels:
    app: mock-app
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: mock-app
  template:
    metadata:
      labels:
        app: mock-app
    spec:
      containers:
      - name: web
        image: nginx:alpine
        ports:
        - containerPort: 80
        env:
        - name: ENV_TYPE
          value: "{{ .Values.environment }}"
        - name: CONFIG_MSG
          value: "{{ .Values.configMessage }}"
